<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoe Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">Shoe<span>Store</span></div>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#products">Shop</a></li>
        <li><a href="#cart">Cart (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section id="home" class="hero">
    <h1>Step Into Style</h1>
    <p>Discover the best collection of trendy shoes at unbeatable prices.</p>
    <button onclick="scrollToProducts()">Shop Now</button>
  </section>

  <!-- Products Section -->
  <section id="products" class="products">
    <h2>Our Collection</h2>
    <div class="product-grid" id="product-list">
      <!-- Product cards will be inserted here by JS -->
    </div>
  </section>

  <!-- Cart Section -->
  <section id="cart" class="cart">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <p id="total-price">Total: $0</p>
  </section>

  <footer>
    <p>© 2025 ShoeStore. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
